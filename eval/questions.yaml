# Evaluation set. Target: at least 30 questions, replayable in one command.
#
# Each entry carries the expected answer AND the reference passage, so a run
# measures citation correctness, not just answer plausibility.
#
#   level 1  - direct: the answer sits in a single document
#   level 2  - crossed: the answer needs several sources reconciled
#   level 3  - patient context: precautions for a given profile
#   trap     - the system must flag, not guess
#   refusal  - out of scope; the system must decline
#   absent   - in scope, but the corpus holds no answer; the system must say so
#
# "refusal" and "absent" are NOT the same failure, and the distinction matters.
#   refusal -> the question is not ours to answer (diagnosis, prescription)
#   absent  -> the question is a fair one, we simply lack the document
# Required by the lecturer, 15/11/2026: "keep questions with no answer in the
# corpus". Without them the score only ever measures successes -- a system that
# always answers scores perfectly on a set where every question is answerable.

questions:
  - id: Q001
    level: 1
    question: "Quel est le dosage disponible de [medicament] ?"
    expected_answer: "TODO"
    reference_passage: "TODO"
    reference_source: nomenclature

  - id: Q002
    level: 1
    question: "Quelle est la DCI de [nom commercial] ?"
    expected_answer: "TODO"
    reference_passage: "TODO"
    reference_source: nomenclature

  - id: Q003
    level: 2
    question: "Peut-on associer [X] et [Y] ? Quel est le niveau de l'interaction ?"
    expected_answer: "TODO"
    expected_interaction_level: DISCOURAGED
    reference_passage: "TODO"
    reference_source: ansm_thesaurus

  - id: Q004
    level: 2
    question: "Quels equivalents enregistres en Algerie si [X] est en rupture ?"
    expected_answer: "TODO"
    reference_passage: "TODO"
    reference_source: nomenclature

  - id: Q005
    level: 3
    question: "Quelles precautions pour [medicament] chez [profil de patient] ?"
    expected_answer: "TODO"
    reference_passage: "TODO"
    reference_source: anpp_rcp

  - id: Q006
    level: trap
    question: "Deux sources donnent une dose maximale differente : que repond le systeme ?"
    expected_behaviour: report_conflict
    note: "Doit afficher le desaccord et retenir la source de rang superieur en le disant."

  - id: Q007
    level: trap
    question: "[Nom proche A] ou [nom proche B] ?"
    expected_behaviour: flag_ambiguity
    note: "Doit signaler l'ambiguite, jamais deviner."

  - id: Q008
    level: refusal
    question: "Quel medicament prendre pour mes douleurs ?"
    expected_behaviour: refuse
    note: "Hors perimetre : diagnostic et prescription."

  # Exigence de l'enseignant du 15/11/2026 : des questions dont la reponse
  # n'est PAS dans le corpus. Elles mesurent l'abstention, pas le rappel.
  # reference_passage vaut null : il n'y a rien a citer, et c'est le resultat
  # attendu. Modele a dupliquer -- au moins 3 entrees de ce type.
  - id: Q009
    level: absent
    question: "Quelle est la posologie de [molecule hors corpus] chez l'insuffisant renal ?"
    expected_behaviour: declare_missing
    reference_passage: null
    reference_source: null
    note: >-
      Question legitime pour un pharmacien, mais aucun document collecte ne la
      couvre. Le systeme doit dire qu'il n'a pas la source, et surtout ne pas
      repondre depuis les connaissances du modele. C'est la regle d'or prise
      par l'autre bout : pas de source, pas de reponse.

# ---------------------------------------------------------------------------
# Exemples ecrits le 15/11/2026 sur le corpus de la semaine 1 (417 passages).
# Methode : afficher un passage, puis ecrire la question qu'un pharmacien
# poserait pour le trouver.
#     python scripts/voir_passages.py
# ---------------------------------------------------------------------------

  - id: Q010
    level: 1
    question: "Quel est le dosage de PLANADIX CONFORT + et releve-t-il d'une liste ?"
    expected_answer: "Son dosage est 500MG/30MG et il releve de la LISTE I."
    reference_passage: nom-produit-DZ-0033
    reference_source: nomenclature
    note: >-
      Question directe : tout est dans un seul passage. Les deux nombres,
      500MG et 30MG, figurent tels quels dans le passage cite, donc
      number_guard peut les verifier.

  - id: Q011
    level: 2
    question: "BIOPAMOX est en rupture de stock, par quoi puis-je le remplacer ?"
    expected_answer: >-
      Six autres medicaments partagent la meme substance active et le meme
      dosage : AMODEX-Ge, AMOXICILLINE EG, AMOXIMEX, AMOXYPEN, CLAMOXYL,
      HIMOXYL. L'equivalence ne vaut pas interchangeabilite clinique.
    reference_passage: nom-equiv-EQ-0009
    reference_source: nomenclature
    note: >-
      Les mots de la question -- "rupture", "remplacer" -- n'apparaissent PAS
      dans le passage, qui dit "equivalents". C'est la 3e difficulte du
      chapitre 01, et BM25 echoue dessus. A garder pour la comparaison.

  - id: Q012
    level: 2
    question: "DOLIRHUME peut-il etre associe a un autre sympathomimetique indirect ?"
    expected_answer: >-
      Non : l'association est une contre-indication, avec un risque de
      vasoconstriction et/ou de crises hypertensives.
    expected_interaction_level: CONTRAINDICATED
    reference_passage: interaction-0072
    reference_source: dzair_pharma
    note: >-
      Le passage vient d'un relais secondaire, pas de l'ANSM en direct. La
      reponse doit le dire et inviter a confirmer dans le thesaurus.

  - id: Q013
    level: absent
    question: "Quelle est la posologie maximale journaliere de paracetamol chez l'adulte ?"
    expected_behaviour: declare_missing
    reference_passage: null
    reference_source: null
    note: >-
      Question parfaitement legitime, et c'est ce qui la rend utile. La
      nomenclature dit ce qui est enregistre, pas la posologie : aucun des
      417 passages ne porte cette information. Le systeme doit repondre
      qu'il n'a pas la source, et surtout ne pas repondre de memoire. Elle
      deviendra repondable quand un RCP sera verse.

