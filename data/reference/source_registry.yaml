# Declared sources, ranked by authority, with their compliance record.
#
# `access` gates automated collection in code (see collect/registry.py):
#   automated  - robots.txt and terms permit crawling, with delays
#   manual     - download by hand only; automation is forbidden
#   forbidden  - excluded from the corpus entirely
#
# `robots_checked_on` MUST be filled in before any automated collection.
# A source that forbids crawling is used manually or dropped, never worked around.

sources:
  - source_id: anpp_rcp
    name: "RCP et notices officiels - ANPP"
    base_url: "https://rcp.anpp.dz/"
    authority: OFFICIAL
    access: manual
    robots_checked_on: "2026-11-13"
    robots_note: "robots.txt autorise tous les chemins publics (Disallow vide)."
    terms_note: "Aucun lien CGU ou mentions legales identifie sur la page d’accueil. Conditions de reutilisation non confirmees. Collecte manuelle uniquement; verifier les droits avant redistribution."
    country: DZ

  - source_id: nomenclature
    name: "Nomenclature nationale - Ministere de l'Industrie pharmaceutique"
    # Corrige le 15/11/2026 : www.mip.gov.dz ne resout pas. Le ministere de
    # l'Industrie PHarmaceutique est sur miph.gov.dz, avec un H.
    base_url: "https://miph.gov.dz/"
    authority: NOMENCLATURE
    access: manual
    robots_checked_on: "2026-11-15"
    robots_note: >-
      robots.txt du 15/11/2026 : "User-agent: * / Disallow:" (vide), donc rien
      n'est interdit ; un sitemap_index.xml est publie. Publication officielle
      du ministere. Les classeurs sont neanmoins telecharges a la main, un par
      version datee, pour garder une trace de ce qui a ete recu et quand.
      Copie : docs/conformite/robots-miph.gov.dz-2026-11-15.txt
    robots_note: "La page de la liste interdit l'acces automatique (robots.txt)."
    terms_note: "Telechargement manuel uniquement. Ni posologie ni indications."
    country: DZ

  - source_id: ansm_thesaurus
    name: "Thesaurus des interactions medicamenteuses - ANSM"
    base_url: "https://ansm.sante.fr/"
    authority: INSTITUTIONAL
    access: manual
    robots_checked_on: "2026-11-15"
    robots_note: >-
      robots.txt du 15/11/2026 : "User-agent: * / Allow: /", aucun crawler d'IA
      bloque. Source institutionnelle a privilegier pour les interactions,
      en direct plutot que par un relais.
      Copie : docs/conformite/robots-ansm.sante.fr-2026-11-15.txt
    robots_note: "A verifier."
    terms_note: "Quatre niveaux d'interaction. Source etrangere : complement, jamais substitut."
    country: FR

  - source_id: dailymed
    name: "DailyMed - notices officielles americaines"
    base_url: "https://dailymed.nlm.nih.gov/"
    authority: INSTITUTIONAL
    access: forbidden
    robots_checked_on: "2026-11-13"
    robots_note: "robots.txt interdit uniquement le chemin /archives/."
    terms_note: "Droits de reutilisation des labels fournis par les societes non confirmes. Ne pas integrer au corpus ni redistribuer sans verification des droits."
    country: US
    language: en

  - source_id: ema
    name: "EMA - notices europeennes"
    base_url: "https://www.ema.europa.eu/"
    authority: INSTITUTIONAL
    access: manual
    robots_checked_on: "2026-11-15"
    robots_note: >-
      robots.txt du 15/11/2026 : acces autorise hors chemins techniques et de
      compte (/core/, /profiles/, /admin/, /search/, /user/login...). Aucun
      crawler d'IA bloque. Notice europeenne : peut differer de l'algerienne.
      Copie : docs/conformite/robots-www.ema.europa.eu-2026-11-15.txt
    terms_note: "Une meme substance peut avoir une notice differente d'un pays a l'autre."
    country: EU

  - source_id: pharmnet
    name: "Pharm'Net (e-Sahti)"
    base_url: "https://pharmnet-dz.com/"
    authority: PROFESSIONAL
    access: manual
    robots_checked_on: "2026-11-13"
    robots_note: "robots.txt autorise les chemins publics et interdit certains chemins prives et administratifs."
    terms_note: "Aucun lien CGU identifie sur la page d'accueil lors de la verification du 13/11/2026. Conditions d'utilisation non confirmees. Collecte manuelle uniquement."
    country: DZ
  - source_id: ansm_bdpm
    name: "Base de donnees publique des medicaments - ANSM"
    base_url: "https://base-donnees-publique.medicaments.gouv.fr/"
    # Rang corrige le 17/11/2026. Le cahier des charges, section 3, place
    # "les references institutionnelles etrangeres : Thesaurus de l'ANSM,
    # notices americaines (DailyMed), europeennes (EMA)" au 3e rang sur 5,
    # sous la nomenclature algerienne. Le rang OFFICIAL est reserve au "RCP
    # et [a] la notice officiels, valides par l'autorite du pays (l'ANPP en
    # Algerie)" -- donc a une source algerienne.
    authority: INSTITUTIONAL
    access: manual
    robots_checked_on: "2026-11-15"
    robots_note: >-
      robots.txt du 15/11/2026 : "User-agent: * / Allow: /", aucun crawler d'IA
      bloque. Notice francaise : complement, jamais substitut a une source
      algerienne (ConflictPolicy.prefer_algerian).
      Copie : docs/conformite/robots-base-donnees-publique.medicaments.gouv.fr-2026-11-15.txt
    robots_note: "robots.txt non verifie. Consultation et collecte manuelles uniquement."
    terms_note: "Les donnees brutes telechargeables sont reutilisables sous conditions: attribution de la source et de la date de mise a jour, sans alteration. La licence des donnees brutes ne doit pas etre presumee applicable aux notices/RCP complets; verifier les droits documentaires avant redistribution."
    country: FR
    language: fr
  - source_id: vidal
    name: "VIDAL - Base de donnees medicamenteuse"
    base_url: "https://www.vidal.fr/"
    authority: PROFESSIONAL
    access: forbidden
    robots_checked_on: "2026-11-13"
    robots_note: "Pages medicaments publiques non interdites explicitement; certains chemins sont interdits."
    terms_note: "Reproduction integrale ou partielle sans consentement interdite selon les CGU. Source exclue faute d autorisation de reutilisation."
    country: FR
    language: fr

  - source_id: medalgerie
    name: "MEDAlgerie"
    base_url: "https://www.medalgerie.com/"
    authority: PROFESSIONAL
    access: forbidden   # conformite non etablie, cf. robots_note
    robots_checked_on: null
    robots_note: >-
      robots.txt non verifiable le 15/11/2026 : le certificat TLS de medalgerie.com
      ne correspond pas au nom de l'hote (SEC_E_WRONG_PRINCIPAL), et
      www.medalgerie.com ne repond pas. Conformite non etablie, donc source
      inutilisee tant que ce point n'est pas leve.
    terms_note: "Redige par un comite de professionnels. Pas d'API mentionnee."
    country: DZ

  - source_id: dzair_pharma
    name: "dzair-pharma.net (DwaDZ)"
    # L'apex repond 308 : le robots.txt qui fait foi est celui de www.
    base_url: "https://www.dzair-pharma.net/"
    authority: PROFESSIONAL
    access: manual
    robots_checked_on: "2026-11-15"
    terms_note: >-
      Recoupement manuel uniquement, aucune collecte automatique.
      robots.txt du 15/11/2026 : /api/, /admin et /diff interdits a tous ;
      23 crawlers d'IA et de SEO bloques sur /. Notre user-agent releve de *,
      donc les pages publiques sont autorisees. Aucune CGU ni clause de
      reutilisation (/a-propos et /privacy lues le 15/11/2026) : conditions
      non confirmees. Le site declare republier la nomenclature du MIPH,
      nos donnees viennent donc de miph.gov.dz.
      Releve : docs/conformite/dzair-pharma-2026-11-15.md
    country: DZ

  - source_id: forums
    name: "Forums, blogs, reseaux sociaux"
    base_url: ""
    authority: DISCARDED
    access: forbidden
    terms_note: "Ecartes du corpus, ainsi que prix, stocks et publicites."
    country: ""
